<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MaxTabs</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    try {
      const theme = localStorage.getItem('maxtabs.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch { /* storage unavailable */ }
  </script>
</head>

<body>
  <div class="app">
    <header class="panel topbar">
      <div class="brand" aria-label="MaxTabs">Max<span>Tabs</span></div>

      <div class="field project-field">
        <label for="project-title">Project</label>
        <input id="project-title" type="text" maxlength="120" value="Untitled" placeholder="Project title">
      </div>

      <div class="field">
        <label for="instrument-select">Instrument</label>
        <select id="instrument-select"></select>
      </div>

      <div class="field">
        <label for="tuning-select">Tuning</label>
        <select id="tuning-select"></select>
      </div>

      <div class="topbar-spacer"></div>

      <div class="transport" aria-label="Transport">
        <div class="field tempo-field">
          <label id="tempo-label" for="tempo-input">BPM</label>
          <input id="tempo-input" type="number" min="20" max="300" value="120" inputmode="numeric">
        </div>

        <div class="field metronome-field">
          <label class="switch" for="metronome-toggle">
            <input id="metronome-toggle" type="checkbox" checked>
            <span>Click</span>
          </label>
          <input id="click-volume" type="range" min="0" max="0.6" step="0.01" value="0.3"
            aria-label="Metronome volume">
        </div>

        <button id="play-button" class="play" type="button" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" /></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
        </button>
      </div>

      <details id="app-menu" class="app-menu">
        <summary aria-label="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </summary>

        <div class="panel app-menu-panel">
          <section class="menu-section" aria-labelledby="menu-project">
            <h2 id="menu-project">Project</h2>
            <div class="menu-actions">
              <button id="project-save" class="btn" type="button">Save in browser</button>
              <button id="project-load" class="btn" type="button">Load browser save</button>
              <button id="project-export" class="btn" type="button">Export file</button>
              <label class="btn file-btn" for="project-open">Open file…</label>
              <input id="project-open" class="visually-hidden" type="file" accept=".json,application/json">
            </div>
            <p id="project-status" class="hint" role="status" aria-live="polite"></p>
          </section>

          <section class="menu-section" aria-labelledby="menu-rhythm">
            <h2 id="menu-rhythm">Rhythm chart</h2>
            <div class="menu-actions">
              <label class="btn file-btn" for="rhythm-file">Import metronome chart…</label>
              <input id="rhythm-file" class="visually-hidden" type="file" accept=".json,application/json">
              <button id="rhythm-reset" class="btn" type="button">New free 4/4</button>
            </div>
            <p id="rhythm-status" class="hint" aria-live="polite"></p>
          </section>

          <section class="menu-section" aria-labelledby="menu-view">
            <h2 id="menu-view">View</h2>
            <div class="menu-row">
              <span>Theme</span>
              <div class="seg theme-switch" id="theme-switch" role="group" aria-label="Theme">
                <button type="button" data-theme-choice="system" title="Follow system">Auto</button>
                <button type="button" data-theme-choice="light">Light</button>
                <button type="button" data-theme-choice="dark">Dark</button>
              </div>
            </div>
            <div class="menu-row">
              <label for="fret-count">Frets</label>
              <select id="fret-count">
                <option value="12">12</option>
                <option value="15" selected>15</option>
                <option value="17">17</option>
                <option value="22">22</option>
                <option value="24">24</option>
              </select>
            </div>
          </section>
        </div>
      </details>
    </header>

    <section class="panel toolbar" aria-label="Note entry">
      <div class="field">
        <span class="label" id="duration-label">Duration</span>
        <div class="chips" id="duration-chips" role="radiogroup" aria-labelledby="duration-label"></div>
      </div>

      <div class="field">
        <span class="label">Modify</span>
        <div class="chips">
          <button id="dot-toggle" class="chip" type="button" aria-pressed="false" title="Dotted (half as long again)">·</button>
          <button id="triplet-toggle" class="chip" type="button" aria-pressed="false" title="Triplet (3 in the time of 2)">3</button>
        </div>
      </div>

      <div class="field">
        <span class="label">Add</span>
        <div class="chips">
          <button id="rest-button" class="btn" type="button" title="Rest (on a note: turn it into a rest)">Rest</button>
          <button id="tie-button" class="btn" type="button" title="Tie the note at the cursor to the one before, or hold the last note longer">Tie</button>
        </div>
      </div>

      <div class="topbar-spacer"></div>

      <div class="history">
        <button id="undo-button" class="btn" type="button" title="Undo (Ctrl+Z)">Undo</button>
        <button id="redo-button" class="btn" type="button" title="Redo (Ctrl+Y)">Redo</button>
        <button id="clear-button" class="btn" type="button">Clear</button>
      </div>
    </section>

    <section class="panel toolbar harmony-bar" aria-label="Harmony">
      <div class="field">
        <span class="label">Overlay</span>
        <div class="inline">
          <label class="switch" for="scale-overlay-toggle">
            <input id="scale-overlay-toggle" type="checkbox">
            <span class="visually-hidden">Show overlay</span>
          </label>
          <div class="seg" id="overlay-mode" role="group" aria-label="Overlay shows">
            <button type="button" data-mode="scale">Scale</button>
            <button type="button" data-mode="chord">Chord</button>
            <button type="button" data-mode="both">Both</button>
          </div>
        </div>
      </div>

      <div class="toolbar-divider" aria-hidden="true"></div>

      <div class="field">
        <label for="scale-tonic-select" id="key-label">Key</label>
        <div class="inline">
          <select id="scale-tonic-select" aria-label="Key tonic"></select>
          <select id="scale-select" aria-label="Scale"></select>
          <button id="key-change-button" class="btn" type="button">Key change here</button>
        </div>
      </div>

      <div class="toolbar-divider" aria-hidden="true"></div>

      <div class="field">
        <label for="chord-root-select">Chord at cursor</label>
        <div class="inline">
          <select id="chord-root-select" aria-label="Chord root"></select>
          <select id="chord-quality-select" aria-label="Chord quality"></select>
        </div>
      </div>

      <p id="harmony-hint" class="hint harmony-hint"></p>
    </section>

    <section class="panel board-panel" aria-labelledby="fretboard-heading">
      <div class="panel-head">
        <h2 id="fretboard-heading">Fretboard</h2>
        <p class="hint">Click a string between two frets, or left of the nut for an open string.</p>
      </div>
      <div class="board-well">
        <div id="fretboard" class="fretboard" role="group" aria-label="Fretboard"></div>
      </div>
      <p id="selected-note" class="hint selected-note">Click a string to write a note.</p>
    </section>

    <section class="panel tab-panel" aria-labelledby="tab-heading">
      <div class="panel-head">
        <h2 id="tab-heading">Tab</h2>
        <p id="cursor-display" class="hint cursor-display">Cursor: Bar 1, beat 1</p>
        <div class="cursor-buttons" role="group" aria-label="Cursor">
          <button id="cursor-prev" class="btn btn-icon" type="button" aria-label="Previous note (←)" title="Previous note (←)">‹</button>
          <button id="cursor-next" class="btn btn-icon" type="button" aria-label="Next note (→)" title="Next note (→)">›</button>
          <button id="delete-button" class="btn btn-icon" type="button" aria-label="Delete note at cursor (Delete)" title="Delete note at cursor (Delete)">⌫</button>
        </div>
        <div class="topbar-spacer"></div>
        <div class="stepper" role="group" aria-label="Bars per row">
          <span class="hint">Bars per row</span>
          <button id="fewer-bars-button" class="btn btn-icon" type="button" aria-label="Fewer bars per row">−</button>
          <output id="bars-per-row-display">4</output>
          <button id="more-bars-button" class="btn btn-icon" type="button" aria-label="More bars per row">+</button>
        </div>
      </div>
      <div id="tab-editor" class="tab-editor" aria-label="Tab"></div>
    </section>

    <p id="playback-status" class="status" role="status" aria-live="polite">Ready</p>
  </div>

  <dialog id="remap-dialog" class="panel remap-dialog" aria-labelledby="remap-title">
    <form method="dialog">
      <h2 id="remap-title">Change instrument or tuning</h2>
      <p id="remap-message"></p>
      <div class="remap-choices">
        <button class="btn" value="pitch" autofocus>
          <strong>Keep pitches</strong>
          <span>Notes sound the same; some move to other frets or strings.</span>
        </button>
        <button class="btn" value="fret">
          <strong>Keep fret numbers</strong>
          <span>The tab stays as written and sounds in the new tuning.</span>
        </button>
      </div>
      <div class="remap-footer">
        <button class="btn" value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
